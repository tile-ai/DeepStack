[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepstack-ae"
version = "1.0.0"
description = "Artifact-evaluation workflow for DeepStack"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSES/Apache-2.0.txt", "NOTICE"]

[tool.setuptools.packages.find]
include = ["ae*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
